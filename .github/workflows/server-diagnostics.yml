name: Server Diagnostics

on:
  workflow_dispatch:
    inputs:
      log_since:
        description: 'Read-only journal start time (server local time or relative time)'
        required: false
        default: '10 minutes ago'
      source_audit:
        description: 'One bounded read-only campus browser audit (no database writes or notifications)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout diagnostics
        uses: actions/checkout@v7

      - name: Check server SSH
        timeout-minutes: 1
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: python3 scripts/check_ssh_connectivity.py

      - name: Inspect production runtime
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          SERVICE_NAME: ${{ secrets.SERVER_SERVICE_NAME }}
          LOG_SINCE: ${{ inputs.log_since || '10 minutes ago' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 8m
          envs: APP_DIR,SERVICE_NAME,LOG_SINCE
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/home/boya-agent}"
            SERVICE_NAME="${SERVICE_NAME:-boya-agent}"
            cd "$APP_DIR"

            echo "== repository =="
            printf 'commit: '; git rev-parse --short=12 HEAD
            if [ -z "$(git status --porcelain)" ]; then echo 'worktree: clean'; else git status --short; fi

            echo "== service =="
            printf 'active: '; sudo systemctl is-active "$SERVICE_NAME"
            printf 'enabled: '; sudo systemctl is-enabled "$SERVICE_NAME"
            sudo systemctl show "$SERVICE_NAME" -p MainPID -p ExecMainStartTimestamp -p ActiveEnterTimestamp --no-pager
            sudo systemctl show "$SERVICE_NAME" -p User -p Group -p TasksMax -p MemoryMax --no-pager
            sudo nginx -t
            python3 - <<'PY'
            from pathlib import Path
            count = 0
            for proc in Path('/proc').glob('[0-9]*'):
                try:
                    args = (proc / 'cmdline').read_bytes().split(b'\0')
                    if args and args[0].endswith(b'/playwright/driver/node'):
                        count += 1
                except OSError:
                    pass
            print('playwright drivers:', count)
            PY

            echo "== .env mail and runtime policy (not process environment; no credentials) =="
            ./venv/bin/python - <<'PY'
            from dotenv import dotenv_values
            config = dotenv_values('.env')
            for key in ('EMAIL_DELIVERY_ENABLED', 'EMAIL_DELIVERY_SCOPE', 'APP_ENV', 'NOTIFICATION_MODE'):
                allowed = {
                    'EMAIL_DELIVERY_ENABLED': {'true', 'false'},
                    'EMAIL_DELIVERY_SCOPE': {'auth', 'all'},
                    'APP_ENV': {'production', 'staging'},
                    'NOTIFICATION_MODE': {'smtp', 'dry_run'},
                }[key]
                value = (config.get(key) or '').strip().lower()
                print(key + ':', value if value in allowed else ('unset' if not value else 'invalid'))
            for prefix in ('SMTP', 'SMTP_VERIFY', 'SMTP_NOTIFY'):
                print(prefix + '_configured:', all(bool(config.get(prefix + '_' + field))
                                                   for field in ('SERVER', 'USERNAME', 'PASSWORD')))
            print('FEISHU_credentials_present:', bool(config.get('FEISHU_WEBHOOK_URL') and config.get('FEISHU_WEBHOOK_SECRET')))
            print('TELEGRAM_credentials_present:', bool(config.get('TELEGRAM_BOT_TOKEN') and config.get('TELEGRAM_CHAT_ID')))
            print('TELEGRAM_OPS_credentials_present:', bool(
                (config.get('TELEGRAM_OPS_BOT_TOKEN') or config.get('TELEGRAM_BOT_TOKEN')) and
                (config.get('TELEGRAM_OPS_CHAT_ID') or config.get('TELEGRAM_CHAT_ID'))))
            print('TELEGRAM_OPS_enabled:', (config.get('TELEGRAM_OPS_ENABLED') or '').lower() == 'true')
            for key in ('FEISHU_ALERTS_ENABLED', 'FEISHU_COURSES_ENABLED'):
                value = (config.get(key) or '').strip().lower()
                print(key + ':', value if value in {'true', 'false'} else ('unset' if not value else 'invalid'))
            PY

            echo "== memory and load =="
            free -h
            swapon --show --bytes || true
            uptime
            sudo systemctl show "$SERVICE_NAME" -p MemoryCurrent -p MemoryPeak -p MemoryMax --no-pager || true
            echo "kernel memory events (last 24h):"
            sudo journalctl -k --since '24 hours ago' --no-pager \
              | grep -Ei 'out of memory|oom-killer|killed process|memory cgroup' \
              | tail -n 40 || true

            echo "== process and scraping logs (requested window) =="
            MAIN_PID="$(sudo systemctl show -p MainPID --value "$SERVICE_NAME")"
            if [ "${MAIN_PID:-0}" != "0" ]; then ps -o pid,ppid,user,etime,cmd -p "$MAIN_PID"; fi
            sudo journalctl -u "$SERVICE_NAME" --since "${LOG_SINCE:-10 minutes ago}" --no-pager -n 500 \
              | grep -E '抓取|scrape|Course coverage|系统已就绪|定时调度|本轮抓取|选课页面|暂无可选课程|ERROR|WARNING|登录|认证|Feishu' \
              | tail -n 180 || true

            echo "== database and notification state =="
            DATABASE_PATH="$(awk -F= '$1 == "DATABASE_PATH" {sub(/^[^=]*=/, ""); print; exit}' .env 2>/dev/null || true)"
            DATABASE_PATH="${DATABASE_PATH:-/var/lib/boya-agent/data/boya_agent.db}"
            case "$DATABASE_PATH" in /*) ;; *) DATABASE_PATH="$APP_DIR/$DATABASE_PATH" ;; esac
            python3 - "$DATABASE_PATH" <<'PY'
            import sqlite3
            import sys
            from datetime import datetime, timezone, timedelta

            from pathlib import Path
            db = sqlite3.connect(Path(sys.argv[1]).resolve().as_uri() + '?mode=ro', uri=True, timeout=30)
            try:
                config = db.execute(
                    "SELECT interval_minutes, email_enabled, telegram_enabled, "
                    "daily_summary_enabled, auto_enroll_enabled, rss_enabled "
                    "FROM filter_config WHERE id = 1"
                ).fetchone()
                print("filter_config:", config)
                print("notification_jobs:", db.execute(
                    "SELECT status, channel, COUNT(*) FROM notification_jobs "
                    "GROUP BY status, channel ORDER BY status, channel"
                ).fetchall())
                print("feishu_job_events:", db.execute(
                    "SELECT job_type, event_type, status, COUNT(*) FROM notification_jobs "
                    "WHERE channel = 'feishu' GROUP BY job_type, event_type, status "
                    "ORDER BY job_type, event_type, status"
                ).fetchall())
                print("feishu_course_acceptance:", db.execute(
                    "SELECT COUNT(*), MAX(pushed_at) FROM push_logs "
                    "WHERE push_type = 'feishu' AND success = 1"
                ).fetchone())
                print("latest_courses:", db.execute(
                    "SELECT COUNT(*), MAX(last_seen) FROM courses"
                ).fetchone())
                print("integrity:", db.execute("PRAGMA integrity_check").fetchone()[0])
                now = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
                quality = db.execute(
                    "SELECT COUNT(*), SUM(start_time IS NULL), SUM(enroll_start IS NULL), "
                    "SUM(enroll_end IS NULL), SUM(COALESCE(capacity,0) <= 0), "
                    "SUM(TRIM(COALESCE(check_in_method,'')) = ''), "
                    "SUM(end_time < start_time OR enroll_end < enroll_start), "
                    "SUM(capacity < 0 OR enrolled < 0), "
                    "SUM(last_seen IS NULL OR last_seen < datetime(?, '-10 minutes')) "
                    "FROM courses WHERE expired = 0 AND (enroll_end IS NULL OR enroll_end > ?) "
                    "AND (end_time IS NULL OR end_time > ?)", (now, now, now)
                ).fetchone()
                print('active_course_quality:', dict(zip(
                    ('rows', 'missing_start', 'missing_enroll_start', 'missing_enroll_end', 'unknown_capacity',
                     'unknown_check_in', 'invalid_time_order', 'negative_counts', 'not_seen_10m'), quality)))
                print('exact_identity_duplicate_groups:', db.execute(
                    "SELECT COUNT(*) FROM (SELECT 1 FROM courses WHERE expired = 0 "
                    "GROUP BY name,start_time,enroll_start,teacher,location,campus HAVING COUNT(*) > 1)"
                ).fetchone()[0])
                print('stale_active_timestamps:', db.execute(
                    "SELECT last_seen,start_time,end_time,enroll_start,enroll_end FROM courses "
                    "WHERE expired = 0 AND (enroll_end IS NULL OR enroll_end > ?) "
                    "AND (end_time IS NULL OR end_time > ?) "
                    "AND (last_seen IS NULL OR last_seen < datetime(?, '-10 minutes')) LIMIT 5", (now, now, now)
                ).fetchall())
            finally:
                db.close()
            PY

            echo "== storage =="
            df -h "$APP_DIR" "$DATABASE_PATH" | tail -n +2
            du -sh "$APP_DIR" "$APP_DIR/logs" "/var/lib/boya-agent" 2>/dev/null || true
            echo "== latest backups =="
            python3 - <<'PY'
            from pathlib import Path
            from datetime import datetime, timezone
            directory = Path('/var/lib/boya-agent/backups')
            for pattern in ('boya_agent-weekly-*.db', 'boya_agent-*.db', 'qrcode-*.tar.gz'):
                files = sorted(directory.glob(pattern), key=lambda path: path.stat().st_mtime, reverse=True)
                print(pattern, 'count=', len(files))
                if files:
                    info = files[0].stat()
                    print('newest:', files[0].name, 'bytes=', info.st_size,
                          'modified_utc=', datetime.fromtimestamp(info.st_mtime, timezone.utc).isoformat())
            PY

      - name: Audit upstream table and pager without business writes
        if: inputs.source_audit
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          envs: APP_DIR
          script: |
            set -euo pipefail
            cd "${APP_DIR:-/home/boya-agent}"
            PLAYWRIGHT_BROWSERS_PATH=/var/lib/boya-agent/playwright ./venv/bin/python - <<'PY'
            import asyncio
            import json
            from dotenv import load_dotenv
            from loguru import logger
            load_dotenv('.env')
            logger.remove()
            from src.scraper import create_browser_context, _open_course_select_page, _wait_course_tables_ready

            async def inspect():
                pw = browser = None
                try:
                    pw, browser, context, page = await create_browser_context()
                    if not await _open_course_select_page(page) or not await _wait_course_tables_ready(page):
                        raise RuntimeError('Source not ready')
                    await page.locator('table:visible').first.wait_for(state='visible', timeout=25000)
                    result = await page.evaluate('''() => {
                      const visible = el => !!(el.getBoundingClientRect().width && el.getBoundingClientRect().height);
                      const controls = Array.from(document.querySelectorAll('a,button,li,span')).filter(el =>
                        visible(el) && /^(上一页|下一页|上页|下页)$/.test((el.textContent || '').trim()));
                      return {
                        tables: Array.from(document.querySelectorAll('table')).filter(visible).map(el => ({
                          rows: el.querySelectorAll('tbody tr').length,
                          headers: Array.from(el.querySelectorAll('th')).map(th => (th.textContent || '').trim().slice(0,30))
                        })),
                        pager: controls.slice(0,12).map(el => ({
                          label: el.textContent.trim(),
                          ancestors: [el, el.parentElement, el.parentElement?.parentElement].filter(Boolean).map(node => ({
                            tag: node.tagName, classes: String(node.className || '').slice(0,120),
                            disabled: node.hasAttribute('disabled'), aria_disabled: node.getAttribute('aria-disabled'),
                            pointer_events: getComputedStyle(node).pointerEvents
                          }))
                        })),
                        totals: Array.from(document.querySelectorAll('.pagination,.el-pagination,.ant-pagination,.pagination-info')).filter(visible)
                          .map(el => (el.textContent || '').match(/共\\s*\\d+\\s*[条门页]/g) || []).flat(),
                        page_numbers: Array.from(document.querySelectorAll('.pagination li, .el-pager li, .ant-pagination-item'))
                          .map(el => ({label:(el.textContent || '').trim().slice(0,40), classes:String(el.className || '').slice(0,100),
                            current:el.getAttribute('aria-current')})),
                        pager_text: Array.from(document.querySelectorAll('.pagination')).map(el => (el.innerText || '').slice(0,300)),
                        pager_structure: Array.from(document.querySelectorAll('.pagination')).map(root => Array.from(root.querySelectorAll('*')).map(el => ({
                          tag: el.tagName, text: (el.children.length ? '' : (el.textContent || '').trim()).slice(0,50),
                          attributes: Object.fromEntries(Array.from(el.attributes).filter(a => ['class','id','name','type','value','aria-current','aria-label','data-page'].includes(a.name)).map(a => [a.name,a.value.slice(0,100)]))
                        }))),
                        pager_parent: Array.from(document.querySelectorAll('.pagination')).map(root => ({
                          tag: root.parentElement.tagName,
                          text: (root.parentElement.innerText || '').slice(-700),
                          numeric_inputs: Array.from(root.parentElement.querySelectorAll('input,select')).map(el => ({
                            tag: el.tagName, value: /^\\d+$/.test(el.value || '') ? el.value : 'non-numeric',
                            options: el.options ? Array.from(el.options).map(o => o.textContent.trim()).filter(t => /^\\d+$/.test(t)).slice(0,50) : []
                          }))
                        })),
                        page_status_lines: (document.body.innerText || '').split('\\n').map(s => s.trim()).filter(s => s.length < 140 && /页|共\\s*\\d+|总.*条|第\\s*\\d+/.test(s)).slice(-25),
                        numeric_controls: Array.from(document.querySelectorAll('select,input')).filter(el => /^\\d+$/.test(el.value || '')).map(el => ({
                          tag:el.tagName, value:el.value, id:el.id, name:el.name,
                          options:el.options ? Array.from(el.options).map(o => o.textContent.trim()).slice(0,25) : []
                        }))
                      };
                    }''')
                    print('source_dom_audit:', json.dumps(result, ensure_ascii=False))
                finally:
                    if browser:
                        await browser.close()
                    if pw:
                        await pw.stop()
            try:
                asyncio.run(asyncio.wait_for(inspect(), timeout=130))
            except Exception as error:
                print('source_dom_audit_failed:', type(error).__name__)
                raise SystemExit(1)
            PY
