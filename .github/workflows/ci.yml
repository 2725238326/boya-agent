name: Continuous Integration

on:
  push:
    branches-ignore: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            constraints.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt -c constraints.txt

      - name: Install frontend tooling
        run: npm ci

      - name: Verify release candidate
        run: .venv/bin/python scripts/verify_release.py --require-clean

      - name: Install browser for offline portal checks
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Verify portal fixtures without external services
        run: |
          .venv/bin/python scripts/verify_portal_browser.py
          .venv/bin/python scripts/verify_home_browser.py
