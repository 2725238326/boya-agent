name: Configure Notification Channels

on:
  workflow_dispatch:
    inputs:
      alerts_enabled:
        description: 'Enable signed scraping failure/recovery messages'
        type: boolean
        default: false
      courses_enabled:
        description: 'Enable course group notifications using current global filters'
        type: boolean
        default: false
      ops_enabled:
        description: 'Enable Telegram operations only (leave course Telegram switch unchanged)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure and verify production Feishu
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          SERVICE_NAME: ${{ secrets.SERVER_SERVICE_NAME }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          TELEGRAM_OPS_PROXY_URL: ${{ secrets.TELEGRAM_OPS_PROXY_URL }}
          ALERTS_ENABLED: ${{ inputs.alerts_enabled }}
          COURSES_ENABLED: ${{ inputs.courses_enabled }}
          OPS_ENABLED: ${{ inputs.ops_enabled }}
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: APP_DIR,SERVICE_NAME,FEISHU_WEBHOOK_URL,FEISHU_WEBHOOK_SECRET,TELEGRAM_OPS_PROXY_URL,ALERTS_ENABLED,COURSES_ENABLED,OPS_ENABLED,EXPECTED_SHA
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/home/boya-agent}"
            SERVICE_NAME="${SERVICE_NAME:-boya-agent}"
            cd "$APP_DIR"
            if [ "$ALERTS_ENABLED" != "false" ]; then
              echo "Student Feishu groups use courses only; operations belong to Telegram."
              exit 1
            fi
            if [ -n "$(git status --porcelain)" ]; then
              echo "Server worktree must be clean before changing notification policy."
              exit 1
            fi
            # Workflow/docs-only commits need not restart a working application.
            # Require exact app, deployment, dependencies and config-script content.
            if ! git cat-file -e "$EXPECTED_SHA^{commit}" 2>/dev/null; then git fetch origin "$EXPECTED_SHA"; fi
            if ! git diff --quiet HEAD "$EXPECTED_SHA" -- src web config deploy requirements.txt constraints.txt \
              scripts/configure_feishu.py scripts/verify_feishu_runtime.py scripts/check_startup_source.py; then
              echo "Server runtime/configuration code differs from the reviewed workflow version. Deploy it first."
              exit 1
            fi
            MAIN_PID="$(sudo systemctl show -p MainPID --value "$SERVICE_NAME")"
            POLICY_CHECK="$(mktemp /var/lib/boya-agent/notification-policy-check.XXXXXX)"
            git show "$EXPECTED_SHA:scripts/notification_policy_restart.py" > "$POLICY_CHECK"
            chmod 600 "$POLICY_CHECK"
            RESTART_NEEDED="$(./venv/bin/python "$POLICY_CHECK" --pid "${MAIN_PID:-0}")"
            rm -f "$POLICY_CHECK"
            case "$RESTART_NEEDED" in true|false) ;; *) echo "Invalid policy comparison result"; exit 1;; esac
            BACKUP_DIR=/var/lib/boya-agent/backups
            PRE_CONFIG="$(mktemp /var/lib/boya-agent/feishu-config-rollback.XXXXXX)"
            cp -p .env "$PRE_CONFIG"
            chmod 600 "$PRE_CONFIG"
            MUTATED=0
            RESTARTED=0
            OPS_TIMER_WAS_ENABLED="$(sudo systemctl is-enabled boya-agent-ops.timer 2>/dev/null || true)"
            OPS_TIMER_WAS_ACTIVE="$(sudo systemctl is-active boya-agent-ops.timer 2>/dev/null || true)"
            restore_on_error() {
              code=$?
              trap - EXIT
              if [ "$code" != "0" ] && { [ "$MUTATED" = "1" ] || ! cmp -s .env "$PRE_CONFIG"; }; then
                cp "$PRE_CONFIG" .env
                sudo chown root:boya-agent .env
                sudo chmod 640 .env
                if [ "$RESTARTED" = "1" ]; then sudo systemctl restart "$SERVICE_NAME" || true; fi
                if [ "$OPS_TIMER_WAS_ENABLED" != "enabled" ]; then sudo systemctl disable boya-agent-ops.timer 2>/dev/null || true; fi
                if [ "$OPS_TIMER_WAS_ACTIVE" != "active" ]; then sudo systemctl stop boya-agent-ops.timer 2>/dev/null || true; fi
                echo "Configuration failure; restored previous environment. Verify service before retrying."
              fi
              echo "Private rollback copy: $PRE_CONFIG"
              exit "$code"
            }
            trap restore_on_error EXIT
            # A successful group probe precedes activation. No secrets are echoed.
            PROBE=()
            if [ "$RESTART_NEEDED" = "true" ] && { [ "$COURSES_ENABLED" = "true" ] || [ "$OPS_ENABLED" = "true" ]; }; then PROBE=(--probe); fi
            ./venv/bin/python scripts/configure_feishu.py --env-file .env --backup-dir "$BACKUP_DIR" \
              --alerts "$ALERTS_ENABLED" --courses "$COURSES_ENABLED" --ops "$OPS_ENABLED" "${PROBE[@]}"
            MUTATED=1
            STARTED_AT="$(date --iso-8601=seconds)"
            if [ "$RESTART_NEEDED" = "true" ]; then
              RESTARTED=1
              sudo systemctl restart "$SERVICE_NAME"
            else
              echo "Effective notification policy already matches; existing application process retained."
            fi
            for attempt in $(seq 1 20); do
              if curl --fail --silent --max-time 5 http://127.0.0.1:5000/healthz >/dev/null; then break; fi
              sleep 3
            done
            sudo systemctl is-active --quiet "$SERVICE_NAME"
            curl --fail --silent --max-time 5 http://127.0.0.1:5000/healthz >/dev/null
            if [ "$RESTARTED" = "1" ]; then
              ./venv/bin/python scripts/check_startup_source.py --url http://127.0.0.1:5000/api/courses \
                --started-at "$STARTED_AT" --timeout 300
            fi
            ./venv/bin/python scripts/verify_feishu_runtime.py --alerts "$ALERTS_ENABLED" --courses "$COURSES_ENABLED" --ops "$OPS_ENABLED"
            if [ "$OPS_ENABLED" = "true" ]; then
              if [ "$APP_DIR" != "/home/boya-agent" ]; then echo "Watchdog unit requires the reviewed /home/boya-agent installation."; exit 1; fi
              sudo install -m 644 deploy/boya-agent-ops.service /etc/systemd/system/boya-agent-ops.service
              sudo install -m 644 deploy/boya-agent-ops.timer /etc/systemd/system/boya-agent-ops.timer
              sudo systemctl daemon-reload
              sudo systemctl enable --now boya-agent-ops.timer
              sudo systemctl start boya-agent-ops.service
              sudo systemctl is-active --quiet boya-agent-ops.timer
              echo "Independent Telegram operations watchdog enabled."
            else
              sudo systemctl disable --now boya-agent-ops.timer 2>/dev/null || true
            fi
            trap - EXIT
            echo "Feishu activation verified. Other channel settings were preserved."
