        auth_basic_user_file /etc/nginx/.htpasswd_boya;

        proxy_pass $boya_upstream;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
