# BOYA Agent Nginx site config (example)
# Place at: /etc/nginx/sites-available/boya-agent
# Enable with: ln -s /etc/nginx/sites-available/boya-agent /etc/nginx/sites-enabled/boya-agent

server {
    listen 80;
    server_name buaaboya.top www.buaaboya.top 49.233.248.86;

    client_max_body_size 10m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 240s;
    proxy_read_timeout 240s;
    send_timeout 240s;

    # Flask app is only exposed to localhost.
    set $boya_upstream http://127.0.0.1:5000;

    location = /console {
        return 301 /admin;
    }

    # Public pages
    location = / {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /subscribe {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /portal {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /rss {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /atom {
        auth_basic off;
