# BOYA Agent Nginx site config (example)
# Place at: /etc/nginx/sites-available/boya-agent
# Enable with: ln -s /etc/nginx/sites-available/boya-agent /etc/nginx/sites-enabled/boya-agent

# HTTP 只负责跳转到 HTTPS，避免会话 Cookie 在明文链路上传输。
server {
    listen 80;
    server_name buaaboya.top www.buaaboya.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name buaaboya.top www.buaaboya.top;

    # 先运行 certbot，再启用本配置；路径按实际证书位置调整。
    ssl_certificate /etc/letsencrypt/live/buaaboya.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buaaboya.top/privkey.pem;
    # Preserve Certbot's managed cipher and DH parameters when this example
    # is installed on the production host.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BOYA:10m;
    ssl_session_tickets off;

    client_max_body_size 10m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 240s;
    proxy_read_timeout 240s;
    send_timeout 240s;
    proxy_set_header Authorization $http_authorization;

    # 页面和接口以文本为主，开启压缩减少移动端首屏传输量。
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Flask app is only exposed to localhost.
    set $boya_upstream http://127.0.0.1:5000;

    location = /console {
        return 301 /admin;
    }

    # Public pages
    location = / {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public liveness/readiness check; detailed status remains admin-only.
    location = /healthz {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /subscribe {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /portal {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /rss {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /atom {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /verify/ {
        auth_basic off;
        # 验证链接包含 bearer secret，不写入 Nginx access log。
        access_log off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /QRcode {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /QRcode/ {
        auth_basic off;
        proxy_pass $boya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
